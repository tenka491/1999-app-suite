name: Anvil Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - "anvil-v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/anvil/src-tauri -> target

      - run: yarn install --frozen-lockfile

      - name: Frontend tests (Vitest)
        run: yarn workspace anvil test

      - name: Rust tests
        working-directory: apps/anvil/src-tauri
        run: cargo test

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
            bundle-glob: |
              apps/anvil/src-tauri/target/release/bundle/deb/*.deb
              apps/anvil/src-tauri/target/release/bundle/rpm/*.rpm
              apps/anvil/src-tauri/target/release/bundle/appimage/*.AppImage
          - platform: windows-latest
            args: ""
            rust-targets: ""
            bundle-glob: |
              apps/anvil/src-tauri/target/release/bundle/msi/*.msi
              apps/anvil/src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            bundle-glob: |
              apps/anvil/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/anvil/src-tauri -> target

      - run: yarn install --frozen-lockfile

      - name: Build Anvil
        run: yarn workspace anvil tauri build ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anvil-${{ matrix.platform }}
          path: ${{ matrix.bundle-glob }}
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/anvil-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Anvil ${{ github.ref_name }}
          draft: true
          files: ${{ matrix.bundle-glob }}
